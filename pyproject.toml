[project]
name = "spotify-capstone"
version = "0.1.0"
description = "Spotify Charts capstone: PostgreSQL schema, loader and data quality checks"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.5",
]

[project.scripts]
spotify-capstone = "spotify_capstone:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
